[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c311"
version = "0.1.0"
description = "Chicago 311 data platform: SODA API -> raw JSON -> Delta -> Postgres, orchestrated by Airflow"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Heavy; only needed where Spark runs (the Airflow image, or a local venv for transform work).
# Versions are the combination Delta documents for Spark 3.5. Verify when you first build.
spark = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",   # mock HTTP for the API client
    "moto[s3]>=5",       # mock S3 for ObjectStore tests
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: needs a local SparkSession + delta jars (slow; skipped in the fast CI job)",
    "integration: needs the docker compose stack (MinIO + Postgres) running",
    "todo: test body is intentionally unimplemented (learning scaffold)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101", "E501"]  # asserts in tests; long prose lines in guidance docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
